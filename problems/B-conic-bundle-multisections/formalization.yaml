status:
  scope: >-
    Formalizes the headline existence theorem that every nonzero smooth
    bidegree-(2,3) hypersurface in P^2 x P^2 over an algebraically closed
    field of characteristic zero admits a dominant rational map from
    relative affine 3-space. The project also proves its existential
    IsUnirationalOver wrapper and gives a concrete smooth example establishing
    non-vacuity. It does not formalize the source proof's divisor-class
    calculation, the uniform degree bound 2a <= 20, or the general
    exact-degree-20 refinement. Two direct sorries remain in legacy modules
    outside the headline dependency closure. The trusted Statement.lean
    comparator placeholder is not counted as an implementation sorry.
  sorry_count: 2
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
    - "sorryAx"
  main_results:
    - declaration: "Bidegree23Unirationality.smooth_bidegree23_hasUnirationalParametrization"
      file: "Solution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      comparator_config: "comparator/smooth_bidegree23_unirationality.json"
      literature_dependencies: []
    - declaration: "BConicBundleMultisections.smooth_bidegree23_hasUnirationalParametrization"
      file: "BConicBundleMultisections/MainTheorem.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      literature_dependencies: []
    - declaration: "BConicBundleMultisections.smooth_bidegree23_isUnirationalOver"
      file: "BConicBundleMultisections/MainTheorem.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
      literature_dependencies: []

