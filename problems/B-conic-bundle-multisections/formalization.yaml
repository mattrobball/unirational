fidelity:
  divergences: >-
    The Lean headline matches the source's field, smoothness, nonzero and
    bidegree hypotheses and proves unirationality by a dominant rational map
    from relative affine 3-space. The implementation represents P^2 x P^2
    and its hypersurface through explicit standard charts, ideal sheaves and
    chart gluing because the needed product-Proj interface is not available
    directly in the pinned Mathlib. It does not formalize the source's
    divisor-class identity T_L ~ aH_x + H_y, the bounds 1 <= a <= 10 and
    2a <= 20, or the general exact-degree-20 refinement. The comparator-facing
    theorem in Solution.lean restates the project's
    Nonempty UnirationalParametrization package as the equivalent direct
    existential dominant rational map. Its vocabulary is defined independently
    from Mathlib in Statement.lean and Solution/Definitions.lean so the
    comparator uses no unchecked definition holes. Two legacy sorries remain
    outside the headline dependency closure.

review:
  status: "self-assessed; agent-reviewed"
  reviewers:
    - "Matthew Robert Ballard (project direction and acceptance)"
    - "Independent source-only AI-agent review (2026-07-26)"
  notes: >-
    This is not independent external peer review or source-author
    verification. Review included an exact theorem-statement guard,
    no-sorry/no-sorryAx guards for the headline, eight direct #print axioms
    checks, a concrete smooth non-vacuity witness, a counterexample to the
    rejected fixed-coordinate-line route, a 3,305-job whole-project build,
    and an independent read-only audit of the family quantifiers, transition
    orientation, factor cancellation, coefficient invariance and circularity.
    The comparator modules and an exact comparator-faithful traversal matched
    all reachable constants. Upstream Comparator v4.32.0, retargeted to Lean
    v4.32.1, accepted byte-identical committed files on macOS and Linux,
    including theorem-closure comparison, permitted-axiom checking and Lean
    default-kernel replay. This did not establish adversarial sandbox security:
    macOS used Comparator's insecure fake-landrun shim, while the
    Apple-container Linux run used real landrun through a command-separator
    adapter, but its kernel had CONFIG_SECURITY_LANDLOCK unset and
    Comparator's --best-effort mode degraded to no Landlock restrictions.

