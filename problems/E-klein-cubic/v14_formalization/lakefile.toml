name = "V14Formalization"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["V14Formalization"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
# Mathlib style linters are noise on the generated certificate layer and their
# warnings alone overflowed the CI log cap (189 MB); they cost elaboration
# time as well. Correctness is unaffected.
weak.linter.unusedSimpArgs = false
weak.linter.unnecessarySimpa = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.1"

[[require]]
name = "BConicBundleMultisections"
git = "https://github.com/mattrobball/unirational.git"
rev = "746c781234c412e1000f8c57d3be9212e756beea"
subDir = "problems/B-conic-bundle-multisections"

[[lean_lib]]
name = "V14Formalization"
globs = ["V14Formalization.*"]

[[lean_lib]]
name = "AxiomAudit"

[[lean_lib]]
name = "V14Challenge"

[[lean_lib]]
name = "V14Solution"
