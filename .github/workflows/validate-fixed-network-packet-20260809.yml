name: Validate Problem E fixed-network classification packet

on:
  push:
    branches:
      - agent/fixed-network-map-classification-20260809
    paths:
      - .github/workflows/validate-fixed-network-packet-20260809.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Check required packet files
        shell: bash
        run: |
          set -euo pipefail
          packet="problems/E-klein-cubic/goal_runs_20260809/FIXED_NETWORK_MAP_CLASSIFICATION"
          for file in \
            STATUS.md THEOREM.md RESOLUTION_CATEGORY.md \
            ELLIPTIC_MAP_CLASSIFICATION.md LINE_MAP_CLASSIFICATION.md \
            TYPE_I_COMPATIBILITY.md TYPE_II_COMPATIBILITY.md \
            EXCEPTIONAL_PROPAGATION.md POLARIZATION_DEGREE.md \
            GLOBAL_PROFILE_LIST.md LITERATURE_AUDIT.md; do
            test -s "$packet/$file"
          done

      - name: Run exact finite verifier
        run: python3 problems/E-klein-cubic/goal_runs_20260809/FIXED_NETWORK_MAP_CLASSIFICATION/verify_profiles.py

      - name: Check FIX I patch idempotency
        run: python3 problems/E-klein-cubic/goal_runs_20260809/FIXED_NETWORK_MAP_CLASSIFICATION/patch_fix_i_bcomplex.py

      - name: Check theorem markers and clean regeneration
        shell: bash
        run: |
          set -euo pipefail
          packet="problems/E-klein-cubic/goal_runs_20260809/FIXED_NETWORK_MAP_CLASSIFICATION"
          grep -Fq 'FIXED-NETWORK-CLASSIFICATION-UNDECIDED' "$packet/STATUS.md"
          grep -Fq 'FIXED_NETWORK_PROFILE_VERIFY_OK' "$packet/verification_output.json"
          grep -Fq 'FIX-I-BINDING-CORRECTION-20260809' problems/E-klein-cubic/theory/FIX_I_bcomplex.md
          ! grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' "$packet" problems/E-klein-cubic/theory/FIX_I_bcomplex.md
          git diff --exit-code -- \
            "$packet/verification_output.json" \
            problems/E-klein-cubic/theory/FIX_I_bcomplex.md
