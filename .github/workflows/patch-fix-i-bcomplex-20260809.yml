name: Patch Problem E FIX I arbitrary-model overreach

on:
  push:
    branches:
      - agent/fixed-network-map-classification-20260809
    paths:
      - .github/workflows/patch-fix-i-bcomplex-20260809.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply binding correction
        run: python3 problems/E-klein-cubic/goal_runs_20260809/FIXED_NETWORK_MAP_CLASSIFICATION/patch_fix_i_bcomplex.py

      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- problems/E-klein-cubic/theory/FIX_I_bcomplex.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add problems/E-klein-cubic/theory/FIX_I_bcomplex.md
          git commit -m "Problem E: repair FIX I arbitrary-model propagation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
