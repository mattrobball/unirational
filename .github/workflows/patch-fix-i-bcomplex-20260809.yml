name: Patch Problem E FIX I arbitrary-model overreach

on:
  push:
    branches:
      - agent/fixed-network-map-classification-20260809
    paths:
      - .github/workflows/patch-fix-i-bcomplex-20260809.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply binding correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('problems/E-klein-cubic/theory/FIX_I_bcomplex.md')
          text = path.read_text()

          marker = 'FIX-I-BINDING-CORRECTION-20260809'
          if marker not in text:
              needle = ('Author: director (Fable). Status: DRAFT-FOR-DERIVATION — every statement here\n'
                        'is to be treated as claimed-until-derived-or-checked; the acceptance tests\n'
                        'T1–T5 in §6 are the validation gate. No claim in this note is consumable for\n'
                        'headline routing until the gate passes.\n')
              insertion = needle + '''\n> **Binding correction — 2026-08-09 (`FIX-I-BINDING-CORRECTION-20260809`).**\n> The per-blowup character calculation in Theorem 2.1 and graph\n> functoriality in Theorem 4.1 remain valid. The every-model conclusion\n> formerly attached to Lemma 4.3 and the arbitrary-resolved-graph Klein\n> funnel formerly stated as Corollary 5.2 are withdrawn. A legal smooth\n> equivariant center can have positive-genus fixed part, and a type-I or\n> type-II blowup in dimension three creates an exceptional `P^2` with\n> disconnected subgroup-fixed loci and rational bypass lines. The corrected\n> scope is stated below and in\n> `goal_runs_20260809/FIXED_NETWORK_MAP_CLASSIFICATION/RESOLUTION_CATEGORY.md`.\n'''
              if needle not in text:
                  raise SystemExit('status insertion anchor not found')
              text = text.replace(needle, insertion, 1)

          lemma_pattern = re.compile(
              r'\*\*Lemma 4\.3 \(RCC propagation through the calculus\)\.\*\*.*?'
              r'\n\n\*\*Corollary 4\.4', re.S)
          lemma_replacement = '''**Lemma 4.3 (RCC propagation along a controlled tower).** In Theorem 2.1,
          every exceptional stratum `P(N^χ)` is a projectivized bundle over
          `F_Z`, hence RCC whenever `F_Z` is; strict transforms preserve
          `δ_bir`. Consequently RCC propagates along a chosen equivariant
          blowup tower **provided every fixed component of every center used in
          that tower is RCC**. It does not follow that every fixed stratum on
          every equivariant model is RCC. A later smooth invariant center may
          have fixed part of arbitrary genus; see Correction I-C and the
          binding correction at the head of this note.

          **Corollary 4.4'''
          text, n = lemma_pattern.subn(lemma_replacement, text, count=1)
          if n != 1:
              raise SystemExit(f'Lemma 4.3 replacement count={n}')

          text = text.replace(
              'Cor 4.4/5.2 hold on the\n> stabilizer-stratified cofinal class (which suffices for every use made\n> of them in T1/T2, whose towers blow up orbit-strata only);',
              'Cor 4.4 holds on the\n> stabilizer-stratified towers used in T1/T2 (these towers are **not** a\n> cofinal class of arbitrary equivariant models); the former Cor 5.2 is\n> withdrawn for actual graph resolutions;',
              1,
          )

          boundary_old = '''1. **The escape is real (no cheap Klein contradiction).** Modulo the FIX-A0
   verification: for an involution `σ` (class 2A, 55 of them; `χ_W(2A) = 1`
   forces the `(3,2)` eigensplit), `X^σ = E_t ⊔ L_t` — a plane cubic and a
   line, with the derived normal types both `(−1)^{⊕2}` in `X`. Corollary
   4.4 then funnels the entire source complex into the **55-line/point
   arrangement**: the elliptic curves `E_t` receive only points. But the
   lines are rational, so line-valued images are permitted — and Fable's
   A4-trisection ([E15]) realizes them. The obstruction content therefore
   cannot be local-constancy; it must be global compatibility over the
   arrangement (Note III's cosheaf `H⁰`).'''
          boundary_new = '''1. **The escape is real (no cheap Klein contradiction).** For an involution
   `σ`, `X^σ = E_t ⊔ L_t` is a plane cubic and a line. RCC strata on a
   chosen stabilizer-stratified source tower map only to points of `E_t`,
   while line-valued images are permitted. This does **not** funnel the
   fixed strata of an arbitrary resolved graph away from `E_t`: legal
   centers can create positive-genus fixed carriers, and the actual landing
   ideal can create exceptional horizontal carriers over the forced
   plus-plane base. Any Klein obstruction must therefore classify those
   carriers and their global compatibility, not invoke local RCC for the
   entire b-complex.'''
          if boundary_old not in text:
              raise SystemExit('boundary-condition paragraph not found')
          text = text.replace(boundary_old, boundary_new, 1)

          cor_pattern = re.compile(
              r'\*\*Corollary 5\.2 \(Klein funnel, conditional on FIX-A0/A1\)\.\*\*.*?'
              r'\n\n## 6\. Acceptance tests', re.S)
          cor_replacement = '''**Withdrawn Corollary 5.2 (arbitrary-model Klein funnel).** The former
          statement quantified over every fixed stratum of every model and is
          false. The exact replacement is conditional:

          > On a specified stabilizer-stratified tower whose center-fixed
          > components are RCC, each RCC fixed stratum maps to a point of an
          > elliptic target component or to an RCC subvariety of a rational
          > target component.

          This conditional statement does not classify the fixed components of
          an actual principalization of a landing base ideal and supplies no
          finite fixed-network theorem. In dimension three the first blowup of
          a `V4` type-I or type-II point has exceptional `P^2`; its involution-
          fixed lines can map to the rational target lines, its `V4` fixed locus
          is disconnected, and it contains rational curves with faithful `V4`
          action. The missing replacement is a refinement-invariant
          normalized-Rees carrier theorem.

          ## 6. Acceptance tests'''
          text, n = cor_pattern.subn(cor_replacement, text, count=1)
          if n != 1:
              raise SystemExit(f'Corollary 5.2 replacement count={n}')

          path.write_text(text)
          PY

      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- problems/E-klein-cubic/theory/FIX_I_bcomplex.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add problems/E-klein-cubic/theory/FIX_I_bcomplex.md
          git commit -m "Problem E: repair FIX I arbitrary-model propagation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
