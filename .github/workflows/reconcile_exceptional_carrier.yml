name: Reconcile exceptional-carrier branch

on:
  push:
    branches:
      - agent/exceptional-carrier-rigidity
    paths:
      - '.github/workflows/reconcile_exceptional_carrier.yml'

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exceptional-carrier-rigidity
          fetch-depth: 0

      - name: Merge current main and resolve notebook semantically
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          NOTEBOOK='problems/E-klein-cubic/NOTEBOOK.md'
          SUPPLEMENT='problems/E-klein-cubic/goal_runs_20260809/EXCEPTIONAL_CARRIER_RIGIDITY/NOTEBOOK_SUPPLEMENT.md'

          git merge origin/main --no-commit || true

          # The theorem packets are disjoint. NOTEBOOK.md is the intentional
          # overlap: current main carries the intrinsic-selfmap correction,
          # and the carrier supplement is the ambient-extendable refinement.
          git show origin/main:"$NOTEBOOK" > "$NOTEBOOK"
          MAIN_SHA="$MAIN_SHA" python3 - <<'PY'
          import os, re
          from pathlib import Path
          notebook = Path('problems/E-klein-cubic/NOTEBOOK.md')
          supplement = Path('problems/E-klein-cubic/goal_runs_20260809/EXCEPTIONAL_CARRIER_RIGIDITY/NOTEBOOK_SUPPLEMENT.md')
          text = notebook.read_text(encoding='utf-8')
          text, n = re.subn(
              r'(notebook parent head: `)[0-9a-f]{7,40}(`)',
              lambda m: m.group(1) + os.environ['MAIN_SHA'] + m.group(2),
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit('expected exactly one notebook parent-head marker')
          marker = '<!-- EXCEPTIONAL_CARRIER_RIGIDITY_20260809 -->'
          if marker not in text:
              text = text.rstrip() + '\n\n' + marker + '\n\n' + supplement.read_text(encoding='utf-8').rstrip() + '\n'
          notebook.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/reconcile_exceptional_carrier.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Merge current main into exceptional-carrier packet'
          git push origin HEAD:agent/exceptional-carrier-rigidity
