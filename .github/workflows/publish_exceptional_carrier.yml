name: Publish exceptional-carrier rigidity packet

on:
  push:
    branches:
      - agent/exceptional-carrier-rigidity
    paths:
      - '.carrier_packet/**'
      - '.github/workflows/publish_exceptional_carrier.yml'

permissions:
  contents: write

concurrency:
  group: publish-exceptional-carrier-rigidity
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: agent/exceptional-carrier-rigidity
          fetch-depth: 0

      - name: Reconstruct and install theorem packet
        shell: bash
        run: |
          set -euo pipefail
          TARGET='problems/E-klein-cubic/goal_runs_20260809/EXCEPTIONAL_CARRIER_RIGIDITY'
          cat .carrier_packet/part_* > /tmp/exceptional_carrier_packet.b64
          base64 --decode /tmp/exceptional_carrier_packet.b64 > /tmp/exceptional_carrier_packet.tar.xz
          echo '238944bdaa59f96589e08db1270d6e37d95af71b88cbf7055977102d2cef195d  /tmp/exceptional_carrier_packet.tar.xz' | sha256sum --check --strict
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          tar -xJf /tmp/exceptional_carrier_packet.tar.xz -C "$TARGET"
          rm -rf .carrier_packet

      - name: Verify exact local models
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet sympy
          python3 problems/E-klein-cubic/goal_runs_20260809/EXCEPTIONAL_CARRIER_RIGIDITY/verify_local_models.py

      - name: Update canonical notebook
        shell: bash
        run: |
          set -euo pipefail
          export PARENT="$(git rev-parse HEAD)"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          notebook = Path('problems/E-klein-cubic/NOTEBOOK.md')
          supplement = Path(
              'problems/E-klein-cubic/goal_runs_20260809/'
              'EXCEPTIONAL_CARRIER_RIGIDITY/NOTEBOOK_SUPPLEMENT.md'
          )
          text = notebook.read_text(encoding='utf-8')
          text, count = re.subn(
              r'(notebook parent head: `)[0-9a-f]{7,40}(`)',
              lambda m: m.group(1) + os.environ['PARENT'] + m.group(2),
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('notebook parent-head marker not found exactly once')
          marker = '<!-- EXCEPTIONAL_CARRIER_RIGIDITY_20260809 -->'
          if marker not in text:
              text = (
                  text.rstrip()
                  + '\n\n'
                  + marker
                  + '\n\n'
                  + supplement.read_text(encoding='utf-8').rstrip()
                  + '\n'
              )
          notebook.write_text(text, encoding='utf-8')
          PY

      - name: Commit publication result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Problem E: install exceptional-carrier rigidity packet'
          git push origin HEAD:agent/exceptional-carrier-rigidity
