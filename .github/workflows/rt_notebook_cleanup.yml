name: RT notebook semantic cleanup

on:
  push:
    branches:
      - agent/rt-split-dichotomy-20260810

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[rt-notebook-clean]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/rt-split-dichotomy-20260810
      - name: Remove superseded notebook entry and bootstrap
        run: python3 .github/rt_notebook_cleanup.py
      - name: Re-run exact packet checks
        run: |
          python3 problems/E-klein-cubic/goal_runs_20260810/RT_SPLIT_AND_DICHOTOMY/verify_norm_sieve.py
          python3 problems/E-klein-cubic/goal_runs_20260810/RT_SPLIT_AND_DICHOTOMY/verify_degree_accounting.py
          python3 problems/E-klein-cubic/goal_runs_20260810/RT_SPLIT_AND_DICHOTOMY/verify_local_rees.py
      - name: Run notebook manifest parity
        run: python3 problems/E-klein-cubic/scripts/check_manifest_parity.py
      - name: Publish semantically clean notebook
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove superseded RT notebook entry [rt-notebook-clean]"
          git push origin HEAD:agent/rt-split-dichotomy-20260810
